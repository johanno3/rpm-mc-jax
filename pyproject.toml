[project]
name = "rpm-mc-jax"
version = "0.1.0"
description = "Restricted primitive model Monte Carlo with Ewald summation: NumPy reference and JAX implementation"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]
license = { text = "MIT" }

[project.optional-dependencies]
jax = ["jax"]
test = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
